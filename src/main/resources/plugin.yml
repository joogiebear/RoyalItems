name: RoyalItems
version: ${version}
main: com.mystipixel.royalitems.RoyalItemsPlugin
api-version: '26.2'
author: Mystipixel
description: Dresses vanilla drops with lore and a PDC identity (item_id / fuel_id) for RoyalMC.
# PacketEvents drives the universal rarity tooltip borders. Soft so RoyalItems still loads
# (borders off) if it is absent; when present, PacketEvents enables first so its API is ready.
softdepend: [packetevents]
commands:
  royalitems:
    description: Give, reload, inspect, and export formatted items.
    usage: /royalitems <give|reload|inspect|formatinv|export>
    aliases: [ritems, rit]
permissions:
  royalitems.admin:
    description: All RoyalItems admin tools, and /royalitems info.
    default: op
    children:
      royalitems.give: true
      royalitems.reload: true
      royalitems.formatinv: true
  royalitems.give:
    description: Give formatted items.
    default: op
  royalitems.reload:
    description: Reload the RoyalItems config.
    default: op
  royalitems.formatinv:
    description: Dress the items already in a player's inventory.
    default: op
