# RoyalItems rarity ladder, used by rules and items via %rarity% / %rarity_color%.
#   display       : the line shown at the foot of an item's lore
#   color         : the colour a rule may tint a name with (%rarity_color%)
#   tooltip-style : optional border sprite, royalitems:<id>. The client pack must ship
#                   assets/royalitems/textures/gui/sprites/tooltip/<id>_background.png and _frame.png,
#                   or the tooltip shows the missing-texture checkerboard. None are bundled.
#                   Ignored unless tooltip-borders.enabled and resource-pack-ready are both true.

rarities:
  common:
    display: "&f&lCOMMON"
    color: "&f"
    tooltip-style: royalitems:common
  uncommon:
    display: "&a&lUNCOMMON"
    color: "&a"
    tooltip-style: royalitems:uncommon
  rare:
    display: "&9&lRARE"
    color: "&9"
    tooltip-style: royalitems:rare
  epic:
    display: "&5&lEPIC"
    color: "&5"
    tooltip-style: royalitems:epic
  legendary:
    display: "&6&lLEGENDARY"
    color: "&6"
    tooltip-style: royalitems:legendary
  mythic:
    display: "&d&lMYTHIC"
    color: "&d"
    tooltip-style: royalitems:mythic
