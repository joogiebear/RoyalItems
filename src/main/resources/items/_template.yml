# RoyalItems — item template (this file is NOT loaded; the leading underscore skips it).
#
# Most items live in the generated catalog (armor.yml, building.yml, materials.yml, …) — run
# /royalitems export to (re)generate it. Hand-tuned items go in 0-overrides.yml, which sorts first and
# wins. Copy an entry below into any items/*.yml and edit, then run /royalitems reload.
#
# Only the KEY is required. It is the item_id AND, upper-cased, the material (ender_pearl -> ENDER_PEARL).
# Everything else is optional with a sensible default:
#   rarity   : common (drives the border, the name colour, and the footer)
#   name     : auto = rarity-coloured title case of the key ("Ender Pearl")
#   lore     : auto = "&8<category>", blank, "<rarity>"   (e.g. "&8Collection Item" / "&f&lCOMMON")
#   category : "Collection Item" (the grey descriptor line in the auto lore)
#   material : the key upper-cased (override only when it differs from the key)
#   fuel     : sets a fuel_id tag so RoyalMinions treats the item as minion fuel
#   tags     : any extra PDC identity, key: value
# Names/lore take legacy '&' codes OR MiniMessage (<red>, <#ff00ff>, <gradient:..>). Supported items
# always format, however they are obtained — there is no per-source option.

formatted-items:

  # Smallest possible entry — everything defaults (common, auto name + lore):
  # example_min:
  #   category: "Collection Item"

  # A rarer item with a custom name and lore:
  # example_relic:
  #   name: "&5Ancient Relic"
  #   rarity: epic
  #   lore:
  #     - "&7A relic of a forgotten age."
  #     - ""
  #     - "&5&lEPIC ARTIFACT"

  # A fuel item (RoyalMinions reads fuel_id):
  # example_fuel:
  #   material: BLAZE_POWDER          # only needed because the key isn't the material name
  #   fuel: blaze_powder
