# ─────────────────────────────────────────────────────────────────────────────
#  RoyalItems — COPY-PASTE TEMPLATE
#
#  This file is SKIPPED by the plugin (the leading "_" means it is never loaded),
#  so nothing here takes effect — it is only a reference. To add custom lore to an
#  item: copy one of the blocks below into a real items/*.yml file (mining.yml,
#  combat.yml, or any of them — the file is just organization), uncomment it, edit,
#  then run  /royalitems reload  in-game. No restart needed; items players already
#  hold re-dress on their next login (format-on-join is on).
#
#  HOW IT WINS:  an explicit entry here beats any rule (rules.yml) for that
#  material — `material:` is the match key, not the filename or the id.
#
#  LITERAL LORE:  unlike rules, explicit item lore is written out verbatim. The
#  %placeholders% (%name%, %rarity%, %category_upper%, …) do NOT expand here —
#  type the colours and words directly, as below.
#
#  RARITY COLOURS (house style):
#    common     &f       uncommon   &a       rare       &9
#    epic       &5       legendary  &6       mythic     &d
#  Footer convention:  &<colour>&l<RARITY> <CATEGORY>     e.g.  &9&lRARE GEM
#
#  format-on — WHEN an item gets dressed (list any that apply):
#    mined    broken as a block            craft    taken from a crafting result
#    mob      dropped by a killed mob      harvest  right-click-harvested crop
#    smith    output of a smithing table
#  Omit it and the item still dresses on join / on demand, just not from an event.
# ─────────────────────────────────────────────────────────────────────────────

formatted-items:

  # ── Example 1: a plain resource (matches the mining/farming/combat house style) ──
  # example_resource:
  #   material: COPPER_INGOT          # the vanilla material to override
  #   display-name: "&aCopper Ingot"  # name coloured by rarity (uncommon = &a)
  #   lore:
  #     - "&8Collection Item"         # dark-grey usage tag
  #     - ""
  #     - "&a&lUNCOMMON METAL"        # bold RARITY CATEGORY footer
  #   tags:
  #     item_id: "copper_ingot"       # PDC identity — keep it unique across all files
  #   format-on:
  #     - mined
  #     - craft

  # ── Example 2: a fuel (adds a usage tag + an effect line, like coal) ──
