# RoyalItems — farming resources. Lore is visual; identity is the PDC (item_id/fuel_id).
# Hypixel-style layout: rarity-coloured name, a "Collection Item" usage tag, then a bold
# "RARITY CATEGORY" footer. Retune display-name, lore, and rarity freely; /royalitems reload to apply.

