# RoyalItems — mining resources. Lore is visual; identity is the PDC (item_id/fuel_id).
# Hypixel-style layout: rarity-coloured name, a "Collection Item" usage tag, then a bold
# "RARITY CATEGORY" footer. Retune display-name, lore, and rarity freely; /royalitems reload to apply.

formatted-items:
  # Coal is special — it is a minion fuel, so it keeps a usage tag and an effect line.
  coal:
    material: COAL
    display-name: "&fCoal"
    lore:
      - "&8Minion Fuel"
      - "&8Collection Item"
      - ""
      - "&7Increases minion speed by &a5%"
      - "&7for &e30 minutes&7."
      - ""
      - "&f&lCOMMON ORE"
    tags:
      item_id: "coal"
      fuel_id: "coal"

