# RoyalItems — weapons catalog (generated by /royalitems export).
# The key is the item_id AND the material; rarity drives the border, name colour and
# footer; category is the grey descriptor line. Name and lore auto-generate — add
# name:/lore: only to customise. Rarity is omitted when it is 'common'.

formatted-items:

  bow:
    rarity: uncommon
    category: "Bow"
  copper_sword:
    category: "Sword"
  crossbow:
    rarity: uncommon
    category: "Crossbow"
  diamond_sword:
    rarity: rare
    category: "Sword"
  golden_sword:
    rarity: uncommon
    category: "Sword"
  iron_sword:
    rarity: uncommon
    category: "Sword"
  mace:
    rarity: epic
    category: "Mace"
  netherite_sword:
    rarity: epic
    category: "Sword"
  stone_sword:
    category: "Sword"
  trident:
    rarity: uncommon
    category: "Trident"
  wooden_sword:
    category: "Sword"
