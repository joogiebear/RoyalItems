# RoyalItems
# Items live in items/, family rules in rules.yml, the rarity ladder in rarities.yml.
# Edit any of them and run /royalitems reload.
# Identity is the PDC tags (item_id, fuel_id, ...); lore is only visual. Names and lore
# accept legacy '&' codes or MiniMessage (<red>, <#ff00ff>, <gradient:..>): a line with
# a <tag> is read as MiniMessage, otherwise as '&' codes.

# Master switch.
enabled: true

# Worlds where RoyalItems does nothing (by name, case-insensitive).
disabled-worlds: []

# Dress a player's inventory when they join, so lore/rarity edits reach items they
# already hold. Custom items are never touched. /royalitems formatinv <player> does
# the same on demand.
format-on-join: true

# Lore for an item entry that has no lore of its own, one line per entry. %category% is the entry's
# category (default-category when it has none), %rarity% its rarity's display text from rarities.yml.
auto-lore:
  default-category: "Collection Item"
  lines:
    - "&8%category%"
    - ""
    - "%rarity%"

# Seconds between inventory sweeps; 0 = off. Dressing is already event-driven (drops, crafts,
# pickups, closing a container), so only set this to catch items injected with no event, such as
# /give or another plugin's API.
format-sweep-seconds: 0

# Rarity tooltip borders.
# Need matching background/frame sprites in the active client resource pack; none are bundled.
# Leave both flags off until you have supplied them. Names, lore and rarity text work without a pack.
tooltip-borders:
  enabled: false
  resource-pack-ready: false

  # Packet borders on items from other plugins too. Requires PacketEvents. Never shown to players in
  # creative mode (the client would save the border into the real item).
  include-custom-items: false

  # A rarity word counts when it is alone on a lore line (`&5&lEPIC`) or shares a line with one of
  # these words (`Tier: Royal Legendary`). Whole words, case-insensitive.
  context-keywords: [TIER, RARITY, ROYAL]

  # Rarity word -> border sprite. Keys are matched against lore with colours stripped and
  # upper-cased, so `&5&lEPIC` matches EPIC. Defaults cover the eco rarities and RoyalItems' ladder.
  styles:
    COMMON: royalitems:common
    UNCOMMON: royalitems:uncommon
    RARE: royalitems:rare
    EPIC: royalitems:epic
    LEGENDARY: royalitems:legendary
    MYTHIC: royalitems:mythic

# Log a note in the console on startup if a newer release is available on GitHub.
update-checker: true
