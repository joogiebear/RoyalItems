# ─────────────────────────────────────────────────────────────────────────────
#  RoyalItems
#
#  Formatted items live in the items/ folder, one file per category — edit or add
#  files there (subfolders are scanned too) and run /royalitems reload.
#
#  Identity is the PDC tags (item_id, fuel_id, ...); LORE IS ONLY VISUAL. A formatted
#  item keeps its Material, so it stacks/sells/crafts as vanilla. A formatted-items:
#  section here still works too, as a global catch-all.
# ─────────────────────────────────────────────────────────────────────────────
