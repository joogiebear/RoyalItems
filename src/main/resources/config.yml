# ─────────────────────────────────────────────────────────────────────────────
#  RoyalItems
#
#  Formatted items live in the items/ folder (one file per category); rules that
#  dress whole families live in rules.yml; the rarity ladder in rarities.yml. Edit
#  any of them and run /royalitems reload.
#
#  Identity is the PDC tags (item_id, fuel_id, ...); LORE IS ONLY VISUAL. A formatted
#  item keeps its Material, so it stacks/sells/crafts as vanilla. Names and lore
#  accept legacy '&' codes OR MiniMessage (<red>, <#ff00ff>, <gradient:..>) — a line
#  with a <tag> is read as MiniMessage, otherwise as '&' codes.
# ─────────────────────────────────────────────────────────────────────────────

# Master switch.
enabled: true

# Worlds where RoyalItems does nothing (by name, case-insensitive).
disabled-worlds: []

# Dress a player's whole inventory when they join, so items they already own get
# formatted too (uses the same guard, so custom items are never touched). This is
# how a lore/rarity change reaches items players already hold — leave it on so an
# edit + /royalitems reload propagates on relog. /royalitems formatinv <player>
# does the same on demand.
format-on-join: true

# Dressing is event-driven: items format instantly when mined/crafted/harvested/picked up, and a
# player's inventory is dressed whenever they close a container (bazaar, trade, chest) — which is when
# bought/traded/withdrawn items arrive. That covers every normal way an item is obtained at no idle
# cost, so this periodic backstop is OFF by default. Set it to a number of seconds only to also catch
# items injected straight into an inventory with no GUI/event (e.g. /give or a plugin). 0 = disabled.
format-sweep-seconds: 0

# ─────────────────────────────────────────────────────────────────────────────
#  Rarity tooltip borders (universal)
# ─────────────────────────────────────────────────────────────────────────────
# Names, lore and rarity text work without a resource pack.
# Custom hover backgrounds need matching background/frame sprites in the ACTIVE client pack.
# No tooltip textures are bundled with this plugin. Leave these off until you have supplied them.
# The readiness flag is deliberately new: old configs with enabled: true safely fall back to
# normal Minecraft tooltips until explicitly opted in. Already stored RoyalItems styles are
# cleaned on the next formatting pass; foreign tooltip styles are preserved.
tooltip-borders:
  enabled: false
  resource-pack-ready: false

  # EcoItems manages its own presentation. Only opt in to cross-plugin packet borders deliberately.
  # Requires PacketEvents; this does not add or replace EcoItems rarity lore.
  # Players in creative mode never see these packet borders: a creative client sends whole items
  # back to the server, which would save the border into the real item. RoyalItems' own items keep theirs.
  include-custom-items: false

  # A rarity word is recognised when it is on its own lore line (e.g. `&5&lEPIC`) OR when it shares a
  # line with one of these context words — so EcoArmor's `Tier: Royal Legendary` is matched, while a
  # flavour line that merely says "a legendary blade" is not. Matched case-insensitively, whole words.
  context-keywords: [TIER, RARITY, ROYAL]

  # Map a rarity to its border. The KEY is matched against each of an item's lore lines with
  # colours stripped, trimmed and upper-cased — so `&5&lEPIC` matches the key `EPIC`. These
  # defaults match both the eco rarities (EcoItems/rarities/*.yml) and RoyalItems' own ladder.
  # COMMON maps to a white border so common items read as a rarity too, matching the others.
  styles:
    COMMON: royalitems:common
    UNCOMMON: royalitems:uncommon
    RARE: royalitems:rare
    EPIC: royalitems:epic
    LEGENDARY: royalitems:legendary
    MYTHIC: royalitems:mythic

# Log a note in the console on startup if a newer release is available on GitHub.
update-checker: true
