# RoyalItems rules: dress items the catalog in items/ doesn't cover (e.g. ones a new Minecraft
# version adds). Explicit items always win over a rule.
#   Match by:  match (globs like '*_WOOL', 'DIAMOND_*', '*') or materials (a list)
#   Rarity:    rarity (flat) or tier-rarity (material-name prefix -> rarity)
#   Templates: %name% %type% %rarity% %rarity_color% %material% %category% %category_upper%

rules:

  # Catch-all: every remaining item as a common Collection Item. Potions, maps, books,
  # heads, banners and fireworks are never dressed.
  everything:
    match:
      - '*'
    rarity: common
    display-name: '%rarity_color%%name%'
    lore:
      - '&8Collection Item'
      - ''
      - '%rarity%'
