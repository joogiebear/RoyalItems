name: Manual Release

# Releases only when started manually from GitHub Actions. Version format: YEAR.ISOWEEK.PATCH.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Release even when there are no new changes
        type: boolean
        default: false

concurrency:
  group: royalitems-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and release tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose version and prepare notes
        id: prep
        env:
          FORCE_RELEASE: ${{ inputs.force }}
        run: python3 .github/release/prepare.py

      - name: Set up Java 25
        if: steps.prep.outputs.release == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Only the build workspace changes: no release commits or bot-authored source history.
      - name: Set embedded version, test and package
        if: steps.prep.outputs.release == 'true'
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          mvn -B --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress clean verify
          cp "target/royalitems-$VERSION.jar" "royalitems-$VERSION.jar"

      - name: Publish release
        if: steps.prep.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          gh release create "$VERSION" "royalitems-$VERSION.jar" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file RELEASE_NOTES.md --latest
